name: Build extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package Thunderbird extension
        shell: bash
        run: |
          JEVIT_VERSION=$(jq -r '.version' manifest.json)
          mkdir -p dist
          zip -9 "dist/jevit-${JEVIT_VERSION}.xpi" \
            manifest.json LICENSE icon-32.png icon-128.png \
            jev.js background.js popup.html popup.js \
            options.html options.js help.html style.css

      - name: Upload installable extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jevit-xpi
          path: dist/*.xpi
          if-no-files-found: error
          retention-days: 30
